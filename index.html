<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEFA Champions League</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #141b2d;
      --accent-color: #00d2ff;
      --text-color: #ffffff;
      --text-muted: #8b9bb4;
      --border-color: #1e293b;
      --live-border: #ff334b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.6rem;
      color: var(--accent-color);
    }

    /* Haupt-Tabs (Spiele / Tabelle) */
    .main-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .main-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .main-tab.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Spieltag-Selector (Horizontales Scrollen) */
    .day-selector {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    .day-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    /* Match Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .teams {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .team img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .match-info {
      text-align: right;
      min-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .date-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .score-display {
      font-weight: bold;
      font-size: 1rem;
      background: #0b0f19;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Tabellen-Ansicht */
    .table-container {
      display: none;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0,0,0,0.2);
    }

    td:nth-child(2) {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    td img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>UEFA Champions League</h1>
  
  <!-- Haupt-Tabs -->
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchMainTab('spiele')">⚽ Spiele</button>
    <button class="main-tab" onclick="switchMainTab('tabelle')">📊 Tabelle</button>
  </div>

  <!-- Bereich: Spiele -->
  <div id="spieleSection">
    <div class="day-selector" id="daySelector"></div>
    <div class="match-list" id="matchList"></div>
  </div>

  <!-- Bereich: Tabelle -->
  <div id="tabelleSection" class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Team</th>
          <th>Sp</th>
          <th>S</th>
          <th>U</th>
          <th>N</th>
          <th>Tore</th>
          <th>Diff</th>
          <th>Pkt</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
// Offizielle Logos für die aktuellen 36 Champions-League-Teilnehmer
const logos = {
  "Real Madrid": "https://crests.football-data.org/86.png",
  "Manchester City": "https://crests.football-data.org/65.png",
  "Bayern München": "https://media.api-sports.io/football/teams/157.png",
  "Paris Saint-Germain": "https://crests.football-data.org/524.png",
  "FC Liverpool": "https://crests.football-data.org/64.png",
  "Inter Mailand": "https://crests.football-data.org/108.png",
  "Borussia Dortmund": "https://crests.football-data.org/4.png",
  "RB Leipzig": "https://crests.football-data.org/721.png",
  "FC Barcelona": "https://crests.football-data.org/81.png",
  "Bayer Leverkusen": "https://crests.football-data.org/3.png",
  "Atlético Madrid": "https://crests.football-data.org/78.png",
  "Atalanta Bergamo": "https://crests.football-data.org/102.png",
  "FC Juventus": "https://crests.football-data.org/109.png",
  "Benfica Lissabon": "https://crests.football-data.org/1903.png",
  "FC Arsenal": "https://crests.football-data.org/57.png",
  "FC Brügge": "https://crests.football-data.org/609.png",
  "Schachtar Donezk": "https://crests.football-data.org/558.png",
  "AC Mailand": "https://crests.football-data.org/98.png",
  "Feyenoord Rotterdam": "https://crests.football-data.org/675.png",
  "Sporting Lissabon": "https://crests.football-data.org/498.png",
  "PSV Eindhoven": "https://crests.football-data.org/674.png",
  "Dinamo Zagreb": "https://media.api-sports.io/football/teams/758.png",
  "VfB Stuttgart": "https://crests.football-data.org/10.png",
  "FC Girona": "https://crests.football-data.org/298.png",
  "Celtic Glasgow": "https://crests.football-data.org/346.png",
  "AS Monaco": "https://crests.football-data.org/548.png",
  "Aston Villa": "https://crests.football-data.org/58.png",
  "FC Bologna": "https://crests.football-data.org/102.png",
  "Stade Brest": "https://crests.football-data.org/512.png",
  "Sparta Prag": "https://crests.football-data.org/471.png",
  "Aston Villa": "https://crests.football-data.org/58.png",
  "Young Boys Bern": "https://crests.football-data.org/1871.png",
  "Roter Stern Belgrad": "https://crests.football-data.org/675.png",
  "Slovan Bratislava": "https://crests.football-data.org/1876.png",
  "Lille OSC": "https://crests.football-data.org/521.png",
  "Sturm Graz": "https://crests.football-data.org/2021.png" // Falls benötigt, sonst oben aktiv
};

function getLogo(teamName) {
  return logos[teamName] || "https://crests.football-data.org/placeholder.png";
}

// Alle 36 Teams als Basis für die Tabelle
const allTeams = [
  "Real Madrid", "Manchester City", "Bayern München", "Paris Saint-Germain", 
  "FC Liverpool", "Inter Mailand", "Borussia Dortmund", "RB Leipzig", 
  "FC Barcelona", "Bayer Leverkusen", "Atlético Madrid", "Atalanta Bergamo", 
  "FC Juventus", "Benfica Lissabon", "FC Arsenal", "FC Brügge", 
  "Schachtar Donezk", "AC Mailand", "Feyenoord Rotterdam", "Sporting Lissabon", 
  "PSV Eindhoven", "Dinamo Zagreb", "VfB Stuttgart", "FC Girona", 
  "Celtic Glasgow", "AS Monaco", "Aston Villa", "FC Bologna", 
  "Stade Brest", "Sparta Prag", "Young Boys Bern", "Roter Stern Belgrad", 
  "Slovan Bratislava", "Lille OSC"
];

// Beispiel-Spielplan (mit optionalen Ergebnissen homeScore / awayScore, falls gespielt)
const schedule = {
  1: [
    { home: "Bayern München", away: "Dinamo Zagreb", date: "16.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "Real Madrid", away: "VfB Stuttgart", date: "16.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "AC Mailand", away: "FC Liverpool", date: "16.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "Sporting Lissabon", away: "Lille OSC", date: "16.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "FC Juventus", away: "PSV Eindhoven", date: "16.09", time: "18:45", homeScore: null, awayScore: null },
    { home: "Young Boys Bern", away: "Aston Villa", date: "16.09", time: "18:45", homeScore: null, awayScore: null },
    { home: "Manchester City", away: "Inter Mailand", date: "17.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "Paris Saint-Germain", away: "FC Girona", date: "17.09", time: "21:00", homeScore: null, awayScore: null },
    { home: "FC Brügge", away: "Borussia Dortmund", date: "17.09", time: "21:00", homeScore: null, awayScore: null }
  ],
  2: [],
  3: [],
  4: [],
  5: [],
  6: [],
  7: [],
  8: []
};

let currentDay = 1;

function switchMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'spiele') {
    document.querySelector('.main-tab:nth-child(1)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'block';
    document.getElementById('tabelleSection').style.display = 'none';
  } else {
    document.querySelector('.main-tab:nth-child(2)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'none';
    document.getElementById('tabelleSection').style.display = 'block';
    calculateTable();
  }
}

function renderSelector() {
  const selectorContainer = document.getElementById("daySelector");
  selectorContainer.innerHTML = "";
  
  for (let i = 1; i <= 8; i++) {
    const btn = document.createElement("button");
    btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
    btn.innerText = `Spieltag ${i}`;
    btn.onclick = () => {
      currentDay = i;
      renderSelector();
      renderMatches();
    };
    selectorContainer.appendChild(btn);
  }
}

function renderMatches() {
  const matchContainer = document.getElementById("matchList");
  matchContainer.innerHTML = "";
  
  const matches = schedule[currentDay] || [];
  
  if (matches.length === 0) {
    matchContainer.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 20px;">Keine Spiele für diesen Spieltag eingetragen.</div>`;
    return;
  }
  
  matches.forEach((match) => {
    const card = document.createElement("div");
    card.className = "match-card";
    
    let infoHtml = `<div class="date-time">${match.date}</div><div class="date-time">${match.time}</div>`;
    if (match.homeScore !== null && match.awayScore !== null) {
      infoHtml = `<div class="score-display">${match.homeScore} : ${match.awayScore}</div>`;
    }

    card.innerHTML = `
      <div class="teams">
        <div class="team"><img src="${getLogo(match.home)}" alt=""> ${match.home}</div>
        <div class="team"><img src="${getLogo(match.away)}" alt=""> ${match.away}</div>
      </div>
      <div class="match-info">
        ${infoHtml}
      </div>
    `;
    matchContainer.appendChild(card);
  });
}

function calculateTable() {
  // Statistik-Objekt für jedes Team initialisieren
  const stats = {};
  allTeams.forEach(team => {
    stats[team] = { played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
  });

  // Alle Spieltage durchgehen und Ergebnisse einrechnen
  Object.values(schedule).forEach(dayMatches => {
    dayMatches.forEach(match => {
      if (match.homeScore !== null && match.awayScore !== null) {
        if (stats[match.home]) {
          stats[match.home].played++;
          stats[match.home].goalsFor += match.homeScore;
          stats[match.home].goalsAgainst += match.awayScore;
        }
        if (stats[match.away]) {
          stats[match.away].played++;
          stats[match.away].goalsFor += match.awayScore;
          stats[match.away].goalsAgainst += match.homeScore;
        }

        if (match.homeScore > match.awayScore) {
          if (stats[match.home]) { stats[match.home].won++; stats[match.home].points += 3; }
          if (stats[match.away]) { stats[match.away].lost++; }
        } else if (match.homeScore < match.awayScore) {
          if (stats[match.away]) { stats[match.away].won++; stats[match.away].points += 3; }
          if (stats[match.home]) { stats[match.home].lost++; }
        } else {
          if (stats[match.home]) { stats[match.home].drawn++; stats[match.home].points += 1; }
          if (stats[match.away]) { stats[match.away].drawn++; stats[match.away].points += 1; }
        }
      }
    });
  });

  // In Array umwandeln und sortieren (Punkte -> Tordifferenz -> Tore)
  const sortedTable = allTeams.map(team => {
    const s = stats[team];
    return {
      name: team,
      ...s,
      diff: s.goalsFor - s.goalsAgainst
    };
  }).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.diff !== a.diff) return b.diff - a.diff;
    return b.goalsFor - a.goalsFor;
  });

  // Tabelle in HTML rendern
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  sortedTable.forEach((row, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><img src="${getLogo(row.name)}" alt=""> ${row.name}</td>
      <td>${row.played}</td>
      <td>${row.won}</td>
      <td>${row.drawn}</td>
      <td>${row.lost}</td>
      <td>${row.goalsFor}:${row.goalsAgainst}</td>
      <td>${row.diff > 0 ? '+' + row.diff : row.diff}</td>
      <td><strong>${row.points}</strong></td>
    `;
    tbody.appendChild(tr);
  });
}

// Initialisierung beim Start
renderSelector();
renderMatches();
</script>

</body>
</html>
