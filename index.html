<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League 2026/27</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #00d2ff;
            --live-red: #ff3333;
            --green: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Haupt-Reiter (Spiele / Tabelle) */
        .main-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
        }

        .main-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .main-tab.active {
            background: var(--accent-color);
            color: #000;
        }

        .status-bar {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        /* Unter-Reiter für Spiele */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .sub-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sub-tab.active {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Sektionen */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Spieltag Block */
        .matchday-container {
            margin-bottom: 24px;
        }

        .matchday-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border-bottom: none;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .match-card:last-child {
            border-radius: 0 0 8px 8px;
            margin-bottom: 0;
        }

        /* Live-Animation & Umrandung */
        .match-card.live {
            border: 2px solid var(--live-red);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 51, 51, 0.4); }
            50% { border-color: rgba(255, 51, 51, 1); }
            100% { border-color: rgba(255, 51, 51, 0.4); }
        }

        .team-side {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .team-side.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-side.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-name {
            font-size: 13px;
            font-weight: 500;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .match-info {
            padding: 0 10px;
            text-align: center;
            min-width: 75px;
        }

        .score {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .match-status {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .match-status.live-text {
            color: var(--live-red);
            font-weight: bold;
        }

        /* Tabelle Styling */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            background: rgba(255,255,255,0.02);
        }

        td.team-col {
            text-align: left;
            padding-left: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-dots {
            display: flex;
            gap: 2px;
            justify-content: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot.win { background-color: var(--green); }
        .dot.loss { background-color: var(--live-red); }
    </style>
</head>

            document.getElementById('clock').innerText = now.toLocaleTimeString();

            // Spiele rendern
            const wrapper = document.getElementById('matchdays-wrapper');
            wrapper.innerHTML = '';

            matchdays.forEach(md => {
                let mdDiv = document.createElement('div');
                mdDiv.className = 'matchday-container';
                
                let html = `<div class="matchday-title">${md.day}</div>`;
                let visibleMatchCount = 0;
                
                md.matches.forEach(m => {
                    const hasResult = (m.homeScore !== null && m.awayScore !== null);
                    // Ein Spiel gilt als beendet, wenn ein Ergebnis vorliegt (und es nicht explizit als Live markiert ist)
                    const isFinished = hasResult && !m.live;
                    const isUpcoming = !hasResult || m.live;

                    let showCard = false;
                    if (currentFilter === 'all') {
                        showCard = true;
                    } else if (currentFilter === 'finished' && isFinished) {
                        showCard = true;
                    } else if (currentFilter === 'upcoming' && isUpcoming) {
                        showCard = true;
                    }

                    if (showCard) {
                        visibleMatchCount++;
                    }

                    const isLive = m.live;
                    const statusText = isLive ? `<span class="match-status live-text">LIVE ${m.liveTime || ''}</span>` : `<span class="match-status">${m.status || m.time + ' Uhr'}</span>`;
                    const scoreText = hasResult ? `${m.homeScore} - ${m.awayScore}` : 'vs';

                    html += `
                        <div class="match-card ${isLive ? 'live' : ''}" style="display: ${showCard ? 'flex' : 'none'};">
                            <div class="team-side home">
                                <span class="team-name">${m.home}</span>
                                <img src="${getTeamLogo(m.home)}" class="team-logo" alt="${m.home}">
                            </div>
                            <div class="match-info">
                                <div class="score">${scoreText}</div>
                                ${statusText}
                            </div>
                            <div class="team-side away">
                                <img src="${getTeamLogo(m.away)}" class="team-logo" alt="${m.away}">
                                <span class="team-name">${m.away}</span>
                            </div>
                        </div>
                    `;
                });

                // Hier blenden wir den Spieltages-Container aus, wenn keine Spiele darin sichtbar sind.
                mdDiv.innerHTML = html;
                if (visibleMatchCount === 0) {
                    mdDiv.style.display = 'none';
                }
                wrapper.appendChild(mdDiv);
            });

            const tbody = document.getElementById('table-body');

                const diff = row.gf - row.ga;
                const diffStr = diff > 0 ? `+${diff}` : diff;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="team-col">
                        <img src="${getTeamLogo(row.team)}" class="team-logo" style="width:16px;height:16px;">
                        ${row.team}
                    </td>
                    <td>${row.played}</td>
                    <td>${row.won}</td>
                    <td>${row.drawn}</td>
                    <td>${row.lost}</td>
                    <td>${row.gf}:${row.ga}</td>
                    <td>${diffStr}</td>
                    <td><strong>${row.pts}</strong></td>
                    <td>
                        <div class="form-dots">
                            <span class="dot ${row.form[0]}"></span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Reiter Umschaltung (Spiele <-> Tabelle)
        function switchMainTab(tab) {
            document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));

            if (tab === 'matches') {
                document.querySelector('.main-tab:nth-child(1)').classList.add('active');
                document.getElementById('section-matches').classList.add('active');
            } else {
                document.querySelector('.main-tab:nth-child(2)').classList.add('active');
                document.getElementById('section-table').classList.add('active');
            }
        }

        // Filter für Spiele (Alle / Beendet / Kommende & Live)
        function filterMatches(filter, event) {
            currentFilter = filter;
            document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderApp();
        }

        // Initialisierung & Live-Ticker Intervall
        renderApp();
        setInterval(renderApp, 1000);
    </script>
</body>
</html>
