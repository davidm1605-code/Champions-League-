<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League - Live & Spiele</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Haupt-Tabs (Spiele / Tabelle) */
        .main-tabs {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* Live-Status Zeile */
        .live-status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: center;
        }

        /* Unter-Tabs (Alle Spiele / Beendet / Kommende / Live) */
        .sub-tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .sub-tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .sub-tab-btn.active {
            background-color: transparent;
            color: var(--accent-color);
            border-color: var(--accent-color);
            font-weight: bold;
        }

        /* Inhaltsbereiche */
        .content-section {
            width: 100%;
            max-width: 600px;
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Spiel-Card Design */
        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .match-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .team.home {
            text-align: right;
        }

        .team.away {
            text-align: left;
        }

        .score-box {
            padding: 0 15px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Live-Anzeige Kennzeichnung */
        .live-badge {
            color: #ff3b30;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>UEFA Champions League</h1>

    <!-- Haupt-Reiter -->
    <div class="main-tabs">
        <button class="tab-btn active" onclick="switchMainTab('games')">⚽ Spiele</button>
        <button class="tab-btn" onclick="switchMainTab('table')">📊 Tabelle</button>
    </div>

    <!-- Live Status -->
    <div class="live-status-bar">
        Live-Aktualisierung aktiv • Stand: <span id="current-time">23:03:37</span>
    </div>

    <!-- Sektion: Spiele -->
    <div id="section-games" class="content-section active">
        <!-- Unter-Reiter -->
        <div class="sub-tabs">
            <button class="sub-tab-btn active" onclick="filterGames('all')">Alle Spiele</button>
            <button class="sub-tab-btn" onclick="filterGames('finished')">Beendet</button>
            <button class="sub-tab-btn" onclick="filterGames('live-upcoming')">Kommende / Live</button>
        </div>

        <!-- Beispiel Spiel 1: Live -->
        <div class="match-card" data-status="live">
            <div class="match-header">
                <span>Spieltag 1</span>
                <span class="live-badge">🔴 LIVE 78' +3'</span>
            </div>
            <div class="match-body">
                <div class="team home">FC Bayern München</div>
                <div class="score-box">2 : 1</div>
                <div class="team away">Galatasaray</div>
            </div>
        </div>

        <!-- Beispiel Spiel 2: Beendet -->
        <div class="match-card" data-status="finished">
            <div class="match-header">
                <span>Spieltag 1</span>
                <span>Beendet</span>
            </div>
            <div class="match-body">
                <div class="team home">Real Madrid</div>
                <div class="score-box">3 : 0</div>
                <div class="team away">VfB Stuttgart</div>
            </div>
        </div>

        <!-- Beispiel Spiel 3: Kommend -->
        <div class="match-card" data-status="upcoming">
            <div class="match-header">
                <span>Spieltag 2</span>
                <span>Mittwoch, 21:00</span>
            </div>
            <div class="match-body">
                <div class="team home">Arsenal FC</div>
                <div class="score-box">- : -</div>
                <div class="team away">Paris Saint-Germain</div>
            </div>
        </div>
    </div>

    <!-- Sektion: Tabelle (Platzhalter) -->
    <div id="section-table" class="content-section">
        <div class="match-card">
            <div style="text-align: center; padding: 20px; color: var(--text-muted);">
                Tabellenansicht wird hier geladen...
            </div>
        </div>
    </div>

    <script>
        function switchMainTab(tab) {
            document.querySelectorAll('.main-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'games') {
                document.querySelector('.main-tabs .tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('section-games').classList.add('active');
            } else {
                document.querySelector('.main-tabs .tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('section-table').classList.add('active');
            }
        }

        function filterGames(filter) {
            document.querySelectorAll('.sub-tabs .sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.match-card');
            cards.forEach(card => {
                const status = card.getAttribute('data-status');
                if (filter === 'all') {
                    card.style.display = 'flex';
                } else if (filter === 'finished' && status === 'finished') {
                    card.style.display = 'flex';
                } else if (filter === 'live-upcoming' && (status === 'live' || status === 'upcoming')) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
