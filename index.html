<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEFA Champions League</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #141b2d;
      --accent-color: #8ab4f8;
      --text-color: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: #202124;
      --card-border: #3c4043;
      --live-border: #ea4335;
      --live-badge: #f28b82;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.4rem;
      color: var(--text-color);
      font-weight: 500;
    }

    /* Haupt-Navigation (Spiele / Tabelle) */
    .main-tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 15px;
      overflow: hidden;
    }

    .main-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .main-tab.active {
      background: #1f293d;
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    /* Spieltag-Selector */
    .day-selector {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 15px;
      padding-bottom: 5px;
      scrollbar-width: none;
    }
    .day-selector::-webkit-scrollbar { display: none; }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .day-btn.active {
      background: #8ab4f8;
      color: #202124;
      font-weight: 600;
      border-color: #8ab4f8;
    }

    /* Match Cards im Google-Stil */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .match-card.live {
      border: 2px solid var(--live-border);
      box-shadow: 0 0 10px rgba(234, 67, 53, 0.3);
    }

    .teams-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .team-row img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .match-status-col {
      text-align: right;
      min-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
    }

    .status-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-label.live-text {
      color: var(--live-badge);
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    .time-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .score-val {
      font-weight: bold;
      font-size: 1rem;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Tabellen-Ansicht */
    .table-container {
      display: none;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--card-border);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      background: #171f30;
    }

    td:nth-child(2) {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    td img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>UEFA Champions League</h1>
  
  <!-- Navigation -->
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchMainTab('spiele')">Spiele</button>
    <button class="main-tab" onclick="switchMainTab('tabelle')">Tabelle</button>
  </div>

  <!-- Bereich: Spiele -->
  <div id="spieleSection">
    <div class="day-selector" id="daySelector"></div>
    <div class="match-list" id="matchList"></div>
  </div>

  <!-- Bereich: Tabelle -->
  <div id="tabelleSection" class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Verein</th>
          <th>Sp</th>
          <th>S</th>
          <th>U</th>
          <th>N</th>
          <th>Tore</th>
          <th>TD</th>
          <th>Pkt</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
// Exakte Logos für die 36 aktuellen Champions-League-Teams
const logos = {
  "Real Madrid": "https://crests.football-data.org/86.png",
  "Manchester City": "https://crests.football-data.org/65.png",
  "Bayern München": "https://media.api-sports.io/football/teams/157.png",
  "Paris Saint-Germain": "https://crests.football-data.org/524.png",
  "FC Liverpool": "https://crests.football-data.org/64.png",
  "Inter Mailand": "https://crests.football-data.org/108.png",
  "Borussia Dortmund": "https://crests.football-data.org/4.png",
  "RB Leipzig": "https://crests.football-data.org/721.png",
  "FC Barcelona": "https://crests.football-data.org/81.png",
  "Bayer Leverkusen": "https://crests.football-data.org/3.png",
  "Atlético Madrid": "https://crests.football-data.org/78.png",
  "Atalanta Bergamo": "https://crests.football-data.org/102.png",
  "FC Juventus": "https://crests.football-data.org/109.png",
  "Benfica Lissabon": "https://crests.football-data.org/1903.png",
  "FC Arsenal": "https://crests.football-data.org/57.png",
  "FC Brügge": "https://crests.football-data.org/609.png",
  "Schachtar Donezk": "https://crests.football-data.org/558.png",
  "AC Mailand": "https://crests.football-data.org/98.png",
  "Feyenoord Rotterdam": "https://crests.football-data.org/675.png",
  "Sporting Lissabon": "https://crests.football-data.org/498.png",
  "PSV Eindhoven": "https://crests.football-data.org/674.png",
  "Dinamo Zagreb": "https://media.api-sports.io/football/teams/758.png",
  "VfB Stuttgart": "https://crests.football-data.org/10.png",
  "FC Girona": "https://crests.football-data.org/298.png",
  "Celtic Glasgow": "https://crests.football-data.org/346.png",
  "AS Monaco": "https://crests.football-data.org/548.png",
  "Aston Villa": "https://crests.football-data.org/58.png",
  "FC Bologna": "https://crests.football-data.org/102.png",
  "Stade Brest": "https://crests.football-data.org/512.png",
  "Sparta Prag": "https://crests.football-data.org/471.png",
  "Young Boys Bern": "https://crests.football-data.org/1871.png",
  "Roter Stern Belgrad": "https://crests.football-data.org/675.png",
  "Slovan Bratislava": "https://crests.football-data.org/1876.png",
  "Lille OSC": "https://crests.football-data.org/521.png",
  "FC Salzburg": "https://crests.football-data.org/1877.png",
  "Sturm Graz": "https://crests.football-data.org/2021.png"
};

function getLogo(teamName) {
  return logos[teamName] || "https://crests.football-data.org/placeholder.png";
}

const allTeams = Object.keys(logos);

// Spielplan mit Status: 'finished' (Endstand), 'upcoming' (zukünftig), 'live' (läuft mit Minute & Nachspielzeit)
const schedule = {
  1: [
    { home: "Bayern München", away: "Dinamo Zagreb", date: "16.09", time: "21:00", status: "finished", homeScore: 9, awayScore: 2 },
    { home: "Real Madrid", away: "VfB Stuttgart", date: "16.09", time: "21:00", status: "finished", homeScore: 3, awayScore: 1 },
    { home: "AC Mailand", away: "FC Liverpool", date: "16.09", time: "21:00", status: "finished", homeScore: 1, awayScore: 3 },
    // Beispiel für ein Live-Spiel mit Spielminute und Nachspielzeit:
    { home: "Manchester City", away: "Inter Mailand", date: "Heute", time: "21:00", status: "live", homeScore: 1, awayScore: 1, minute: "45'+3'" },
    { home: "Paris Saint-Germain", away: "FC Girona", date: "Heute", time: "21:00", status: "upcoming", homeScore: null, awayScore: null },
    { home: "Borussia Dortmund", away: "FC Brügge", date: "17.09", time: "21:00", status: "upcoming", homeScore: null, awayScore: null }
  ],
  2: [],
  3: [],
  4: [],
  5: [],
  6: [],
  7: [],
  8: []
};

let currentDay = 1;

function switchMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'spiele') {
    document.querySelector('.main-tab:nth-child(1)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'block';
    document.getElementById('tabelleSection').style.display = 'none';
  } else {
    document.querySelector('.main-tab:nth-child(2)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'none';
    document.getElementById('tabelleSection').style.display = 'block';
    calculateTable();
  }
}

function renderSelector() {
  const selector = document.getElementById("daySelector");
  selector.innerHTML = "";
  for (let i = 1; i <= 8; i++) {
    const btn = document.createElement("button");
    btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
    btn.innerText = `Spieltag ${i}`;
    btn.onclick = () => {
      currentDay = i;
      renderSelector();
      renderMatches();
    };
    selector.appendChild(btn);
  }
}

function renderMatches() {
  const container = document.getElementById("matchList");
  container.innerHTML = "";
  
  const matches = schedule[currentDay] || [];
  if (matches.length === 0) {
    container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 20px;">Keine Spiele an diesem Spieltag.</div>`;
    return;
  }
  
  matches.forEach(match => {
    const card = document.createElement("div");
    card.className = `match-card ${match.status === 'live' ? 'live' : ''}`;
    
    let statusColHtml = '';
    if (match.status === 'finished') {
      statusColHtml = `
        <span class="status-label">Endstand</span>
        <span class="score-val">${match.homeScore} : ${match.awayScore}</span>
      `;
    } else if (match.status === 'live') {
      statusColHtml = `
        <span class="status-label live-text">LIVE ${match.minute}</span>
        <span class="score-val" style="color: var(--live-badge);">${match.homeScore} : ${match.awayScore}</span>
      `;
    } else {
      statusColHtml = `
        <span class="time-label">${match.date}</span>
        <span class="time-label">${match.time}</span>
      `;
    }

    card.innerHTML = `
      <div class="teams-col">
        <div class="team-row"><img src="${getLogo(match.home)}" alt=""> ${match.home}</div>
        <div class="team-row"><img src="${getLogo(match.away)}" alt=""> ${match.away}</div>
      </div>
      <div class="match-status-col">
        ${statusColHtml}
      </div>
    `;
    container.appendChild(card);
  });
}

function calculateTable() {
  const stats = {};
  allTeams.forEach(team => {
    stats[team] = { played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
  });

  // Alle gespielten und live Spiele einrechnen
  Object.values(schedule).forEach(dayMatches => {
    dayMatches.forEach(match => {
      if ((match.status === 'finished' || match.status === 'live') && match.homeScore !== null && match.awayScore !== null) {
        if (stats[match.home]) {
          stats[match.home].played++;
          stats[match.home].goalsFor += match.homeScore;
          stats[match.home].goalsAgainst += match.awayScore;
        }
        if (stats[match.away]) {
          stats[match.away].played++;
          stats[match.away].goalsFor += match.awayScore;
          stats[match.away].goalsAgainst += match.homeScore;
        }

        if (match.homeScore > match.awayScore) {
          if (stats[match.home]) { stats[match.home].won++; stats[match.home].points += 3; }
          if (stats[match.away]) { stats[match.away].lost++; }
        } else if (match.homeScore < match.awayScore) {
          if (stats[match.away]) { stats[match.away].won++; stats[match.away].points += 3; }
          if (stats[match.home]) { stats[match.home].lost++; }
        } else {
          if (stats[match.home]) { stats[match.home].drawn++; stats[match.home].points += 1; }
          if (stats[match.away]) { stats[match.away].drawn++; stats[match.away].points += 1; }
        }
      }
    });
  });

  const sortedTable = allTeams.map(team => {
    const s = stats[team];
    return { name: team, ...s, diff: s.goalsFor - s.goalsAgainst };
  }).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.diff !== a.diff) return b.diff - a.diff;
    return b.goalsFor - a.goalsFor;
  });

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  sortedTable.forEach((row, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><img src="${getLogo(row.name)}" alt=""> ${row.name}</td>
      <td>${row.played}</td>
      <td>${row.won}</td>
      <td>${row.drawn}</td>
      <td>${row.lost}</td>
      <td>${row.goalsFor}:${row.goalsAgainst}</td>
      <td>${row.diff > 0 ? '+' + row.diff : row.diff}</td>
      <td><strong>${row.points}</strong></td>
    `;
    tbody.appendChild(tr);
  });
}

renderSelector();
renderMatches();
</script>

</body>
</html>
