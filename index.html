  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00d2ff;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .day-selector {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      margin-bottom: 25px;
      padding-bottom: 5px;
    }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .day-btn.active, .day-btn:hover {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .teams {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team {
      font-size: 1.05rem;
      font-weight: 500;
    }

    .match-info {
      text-align: right;
      min-width: 80px;
    }

    .date {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-color);
    }

    .time {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>

let currentDay = 1;

function renderSelector() {
  const selectorContainer = document.getElementById("daySelector");
  selectorContainer.innerHTML = "";
  
  for (let i = 1; i <= 8; i++) {
    const btn = document.createElement("button");
    btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
    btn.innerText = `Spieltag ${i}`;
    btn.onclick = () => {
      currentDay = i;
      renderSelector();
      renderMatches();
    };
    selectorContainer.appendChild(btn);
  }
}

function renderMatches() {
  const matchContainer = document.getElementById("matchList");
  matchContainer.innerHTML = "";
  
  const matches = schedule[currentDay] || [];
  
  matches.forEach(match => {
    const card = document.createElement("div");
    card.className = "match-card";
    
    card.innerHTML = `
      <div class="teams">
        <div class="team">${match.home}</div>
        <div class="team">${match.away}</div>
      </div>
      <div class="match-info">
        <div class="date">${match.date}</div>
        <div class="time">${match.time}</div>
      </div>
    `;
    
    matchContainer.appendChild(card);
  });
}
