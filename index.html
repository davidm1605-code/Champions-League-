<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions League Live & Tabellen</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-card: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #00ffcc;
            --live-red: #ff3b30;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        nav button {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Spieltag & Spiele Styling */
        .matchday-title {
            font-size: 1.1rem;
            margin: 20px 0 10px 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .match-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Live-Ticker Animation & Umrandung */
        .match-card.live {
            border: 2px solid var(--live-red);
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 38%;
        }

        .team.away {
            justify-content: flex-end;
            text-align: right;
        }

        .team img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .match-info {
            text-align: center;
            width: 24%;
            font-size: 0.9rem;
        }

        .score {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .time {
            color: var(--text-secondary);
        }

        .live-badge {
            color: var(--live-red);
            font-weight: bold;
            font-size: 0.8rem;
            display: block;
        }

        /* Tabellen Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-card);
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-weight: 600;
        }

        td:nth-child(2) {
            text-align: left;
        }

        .table-team {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-team img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Champions League Hub</h2>
        <nav>
            <button onclick="switchView('matches')" id="btn-matches" class="active">Spiele</button>
            <button onclick="switchView('table')" id="btn-table">Tabelle</button>
        </nav>
    </header>

    <div class="container">
        <!-- SPIELE ANSICHT -->
        <div id="view-matches" class="view-section active">
            <div class="matchday-title">Spieltag 1 von 8</div>
            
            <!-- Beendetes Spiel -->
            <div class="match-card">
                <div class="team">
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                    <span class="team-name">Club Brügge</span>
                </div>
                <div class="match-info">
                    <div class="score">2 : 1</div>
                    <span class="time" style="font-size: 0.75rem; color: var(--text-secondary);">Endstand</span>
                </div>
                <div class="team away">
                    <span class="team-name">Aston Villa</span>
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                </div>
            </div>

            <!-- LIVE SPIEL mit Verlängerung und roter Umrandung -->
            <div class="match-card live">
                <div class="team">
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                    <span class="team-name">Real Madrid</span>
                </div>
                <div class="match-info">
                    <div class="score">2 : 2</div>
                    <span class="live-badge">LIVE 104'</span>
                    <span style="font-size: 0.7rem; color: var(--accent-color);">4 + 4 Min. Verl.</span>
                </div>
                <div class="team away">
                    <span class="team-name">Inter Mailand</span>
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                </div>
            </div>

            <!-- Noch nicht gespielt (mit Uhrzeit) -->
            <div class="match-card">
                <div class="team">
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                    <span class="team-name">BVB Dortmund</span>
                </div>
                <div class="match-info">
                    <div class="time">21:00</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">27.01.27</div>
                </div>
                <div class="team away">
                    <span class="team-name">Villarreal</span>
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                </div>
            </div>
        </div>

        <!-- TABELLEN ANSICHT -->
        <div id="view-table" class="view-section">
            <div class="matchday-title">Ligagruppe Gesamttabelle</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>Sp</th>
                        <th>Tore</th>
                        <th>Diff</th>
                        <th>Pkt</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>
                            <div class="table-team">
                                <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                                <span>PSG</span>
                            </div>
                        </td>
                        <td>1</td>
                        <td>6:1</td>
                        <td>+5</td>
                        <td>3</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>
                            <div class="table-team">
                                <img src="https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png" alt="Logo">
                                <span>FC Bayern</span>
                            </div>
                        </td>
                        <td>1</td>
                        <td>5:0</td>
                        <td>+5</td>
                        <td>3</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

            document.getElementById('view-' + viewName).classList.add('active');
            document.getElementById('btn-' + viewName).classList.add('active');
        }
    </script>
</body>
</html>
