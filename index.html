<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions League Hub</title>
    <style>
        :root {
            --bg-color: #0e1111;
            --card-bg: #1a1f1f;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: #2a3439;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .matchday-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }
        .team {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .team.away {
            justify-content: flex-end;
            text-align: right;
        }
        .team img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .score-box {
            text-align: center;
        }
        .score {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .status.live {
            color: #ff3333;
            font-weight: bold;
        }
        /* Tabelle Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #22292f;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        td.pos {
            font-weight: bold;
            color: var(--accent);
            width: 30px;
            text-align: center;
        }
        td.pts {
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>

        <button class="nav-btn" onclick="switchView('tabelle')">Tabelle</button>

                <!-- Dynamisch generierte Spiele des 1. Spieltags -->
            </div>
        </div>

        <!-- TABELLE ANSICHT -->

                        <th>Team</th>
                        <th style="text-align: center;">Sp</th>
                        <th style="text-align: center;">Tore</th>
                        <th style="text-align: right;">Pkt</th>
                    </tr>
                </thead>

                    <!-- Dynamisch generierte Tabelle basierend auf echten Daten -->

            </table>
        </div>
    </div>

        function renderMatches() {
