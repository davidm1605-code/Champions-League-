<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League 2026/27 - Live</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #00d2ff;
            --live-red: #ff3333;
            --green: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .main-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
        }

        .main-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .main-tab.active {
            background: var(--accent-color);
            color: #000;
        }

        .status-bar {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .sub-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sub-tab.active {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Spezial-Styling für den Live-Sub-Tab */
        .sub-tab.live-tab-btn {
            border-color: rgba(255, 51, 51, 0.4);
            color: var(--text-secondary);
        }

        .sub-tab.live-tab-btn.has-live {
            border-color: var(--live-red);
            color: var(--live-red);
            font-weight: 700;
            animation: pulse-border 1.5s infinite;
        }

        .sub-tab.live-tab-btn.active {
            background: var(--live-red);
            color: #fff;
            border-color: var(--live-red);
        }

        .filter-row {
            display: flex;
            gap: 8px;
        }

        .team-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            flex: 1;
        }

        .reset-filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .reset-filter-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .matchday-container {
            margin-bottom: 20px;
        }

        .matchday-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border-bottom: none;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .match-card:last-child {
            border-radius: 0 0 8px 8px;
            margin-bottom: 0;
        }

        .match-card.live {
            border: 2px solid var(--live-red);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 51, 51, 0.4); }
            50% { border-color: rgba(255, 51, 51, 1); }
            100% { border-color: rgba(255, 51, 51, 0.4); }
        }

        .team-side {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .team-side.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-side.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-name {
            font-size: 14px;
            font-weight: 600;
            width: 105px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 50%;
            padding: 2px;
            flex-shrink: 0;
        }

        .match-info {
            padding: 0 6px;
            text-align: center;
            flex: 0 0 85px;
        }

        .score {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .match-status {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .match-status.live-text {
            color: var(--live-red);
            font-weight: bold;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            background: rgba(255,255,255,0.02);
            text-transform: uppercase;
        }

        td.team-col {
            text-align: left;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .form-dots {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.win { background-color: var(--green); }
        .dot.loss { background-color: var(--live-red); }
        .dot.draw { background-color: var(--text-secondary); }

        .no-live-msg {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>UEFA Champions League</h1>
        
        <div class="main-tabs">
            <button class="main-tab active" onclick="switchMainTab('matches')">⚽ Spiele</button>
            <button class="main-tab" onclick="switchMainTab('table')">📊 Tabelle</button>
        </div>
        
        <div class="status-bar" id="status-bar">Live-API verbunden • Letztes Update: <span id="clock">--:--:--</span></div>
    </header>

    <!-- SPIELE SEKTION -->
    <div id="section-matches" class="section active">
        <div class="controls-container">
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="filterMatches('all', event)">Alle Spiele</button>
                <button class="sub-tab" onclick="filterMatches('finished', event)">Beendet</button>
                <button class="sub-tab" onclick="filterMatches('upcoming', event)">Kommende</button>
                <button id="live-tab-btn" class="sub-tab live-tab-btn" onclick="filterMatches('only-live', event)">🔴 Live</button>
            </div>
            <div class="filter-row">
                <select id="team-filter" class="team-select" onchange="filterByTeam(this.value)">
                    <option value="all">🔍 Alle Mannschaften anzeigen</option>
                </select>
                <button class="reset-filter-btn" onclick="resetTeamFilter()">Alle</button>
            </div>
        </div>

        <div id="matchdays-wrapper">
            <!-- Wird dynamisch gefüllt -->
        </div>
    </div>

    <!-- TABELLE SEKTION -->
    <div id="section-table" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;">#</th>
                        <th style="text-align: left; padding-left: 12px;">Team</th>
                        <th>Sp</th>
                        <th>S</th>
                        <th>U</th>
                        <th>N</th>
                        <th>Tore</th>
                        <th>Diff</th>
                        <th>Pkt</th>
                        <th>Letzte Form</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Wird dynamisch berechnet -->
                </tbody>
            </table>
        </div>
    </div>
