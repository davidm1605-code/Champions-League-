<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League 2026/27</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #00d2ff;
            --live-red: #ff3333;
            --green: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Haupt-Reiter (Spiele / Tabelle) */
        .main-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
        }

        .main-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .main-tab.active {
            background: var(--accent-color);
            color: #000;
        }

        .status-bar {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        /* Unter-Reiter für Spiele */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .sub-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sub-tab.active {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Sektionen */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Spieltag Block */
        .matchday-container {
            margin-bottom: 24px;
        }

        .matchday-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border-bottom: none;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .match-card:last-child {
            border-radius: 0 0 8px 8px;
            margin-bottom: 0;
        }

        .team-side {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .team-side.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-side.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-name {
            font-size: 13px;
            font-weight: 500;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .match-info {
            padding: 0 10px;
            text-align: center;
            min-width: 75px;
        }

        .score {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .match-status {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Tabelle Styling */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            background: rgba(255,255,255,0.02);
        }

        td.team-col {
            text-align: left;
            padding-left: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-dots {
            display: flex;
            gap: 2px;
            justify-content: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot.win { background-color: var(--green); }
        .dot.loss { background-color: var(--live-red); }
        .dot.draw { background-color: var(--text-secondary); }
    </style>
</head>

        <div class="main-tabs">

            <button class="main-tab" onclick="switchMainTab('table')">📊 Tabelle</button>
        </div>
        
        <div class="status-bar" id="status-bar">Stand: <span id="clock">--:--:--</span></div>
    </header>

    <div id="section-matches" class="section active">

            <button class="sub-tab" onclick="filterMatches('finished')">Beendet</button>
            <button class="sub-tab" onclick="filterMatches('upcoming')">Kommende</button>

        <div id="matchdays-wrapper"></div>
    </div>

            } else {
