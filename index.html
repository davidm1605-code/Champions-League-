    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00e676;
            --live-color: #ff3d00;
            --border-color: #2c2c2c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        /* Live-Ticker Header Banner */
        .live-ticker-banner {
            background-color: #261010;
            border: 1px solid var(--live-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .live-ticker-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--live-color);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--live-color);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Spieltage & Match-Cards */
        .matchday-title {
            font-size: 1.1rem;
            margin: 25px 0 10px 0;
            color: #b0b0b0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .match-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .match-card.is-live {
            border-color: var(--live-color);
            background-color: #221818;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 500;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box {
            text-align: right;
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        .live-score {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .live-time {
            color: var(--live-color);
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>

function renderDashboard() {
    const scheduleContainer = document.getElementById('scheduleContainer');
    const liveMatchesContainer = document.getElementById('liveMatchesContainer');
    const liveTickerBanner = document.getElementById('liveTickerBanner');

    scheduleContainer.innerHTML = '';
    liveMatchesContainer.innerHTML = '';

    let currentDayTitle = '';
    let hasLiveMatches = false;

    matchesData.forEach(match => {
        if (match.day !== currentDayTitle) {
            currentDayTitle = match.day;
            const titleEl = document.createElement('div');
            titleEl.className = 'matchday-title';
            titleEl.innerText = currentDayTitle;
            scheduleContainer.appendChild(titleEl);
        }

        const card = document.createElement('div');
        card.className = `match-card ${match.live ? 'is-live' : ''}`;

        const scoreOrTime = match.live 
            ? `<div class="live-score">${match.score}</div><div class="live-time">${match.minute}</div>`
            : `<div>${match.date}</div><div>${match.time}</div>`;

        card.innerHTML = `
            <div class="teams">
                <div class="team-row"><span>${match.home}</span></div>
                <div class="team-row"><span>${match.away}</span></div>
            </div>
            <div class="info-box">${scoreOrTime}</div>
        `;

        scheduleContainer.appendChild(card);

        if (match.live) {
            hasLiveMatches = true;
            const liveClone = card.cloneNode(true);
            liveMatchesContainer.appendChild(liveClone);
        }
    });

    liveTickerBanner.style.display = hasLiveMatches ? 'block' : 'none';
}

renderDashboard();
