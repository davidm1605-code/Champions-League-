<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #141b2d;
      --accent-color: #00d2ff;
      --text-color: #ffffff;
      --text-muted: #8b9bb4;
      --border-color: #1e293b;
      --live-border: #ff334b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.6rem;
      color: var(--accent-color);
    }

    /* Haupt-Tabs (Spiele / Tabelle) */
    .main-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .main-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .main-tab.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Spieltag-Selector (Horizontales Scrollen) */
    .day-selector {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    .day-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    /* Match Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .teams {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 500;
    }

    .team img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .match-info {
      text-align: right;
      min-width: 70px;
    }

    .date-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Tabellen-Ansicht */
    .table-container {
      display: none;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>

let currentDay = 1;

function switchMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'spiele') {
    document.querySelector('.main-tab:nth-child(1)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'block';
    document.getElementById('tabelleSection').style.display = 'none';
  } else {
    document.querySelector('.main-tab:nth-child(2)').classList.add('active');
    document.getElementById('spieleSection').style.display = 'none';
    document.getElementById('tabelleSection').style.display = 'block';
  }
}

function renderSelector() {
  const selectorContainer = document.getElementById("daySelector");
  selectorContainer.innerHTML = "";
  
  for (let i = 1; i <= 8; i++) {
    const btn = document.createElement("button");
    btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
    btn.innerText = `Spieltag ${i}`;
    btn.onclick = () => {
      currentDay = i;
      renderSelector();
      renderMatches();
    };
    selectorContainer.appendChild(btn);
  }
}

function renderMatches() {
  const matchContainer = document.getElementById("matchList");
  matchContainer.innerHTML = "";
  
  const matches = schedule[currentDay] || [];
  
  matches.forEach((match) => {
    const card = document.createElement("div");
    card.className = "match-card";
    // Alle Spiele zeigen nun sauber Datum und Uhrzeit (keine künstlichen Live-Spiele mehr)
    card.innerHTML = `
      <div class="teams">
        <div class="team"><img src="${getLogo(match.home)}" alt=""> ${match.home}</div>
        <div class="team"><img src="${getLogo(match.away)}" alt=""> ${match.away}</div>
      </div>
      <div class="match-info">
        <div class="date-time">${match.date}</div>
        <div class="date-time">${match.time}</div>
      </div>
    `;
    matchContainer.appendChild(card);
  });
}
